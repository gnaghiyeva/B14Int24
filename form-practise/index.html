<!doctype html>
<html lang="en">
  <head>

    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div class="form_container">
      <article class="text_container">
        <h1>Student Registration Form</h1>

      <div class="form">

          <div>

          </div>
          <br />
          <div>
            <label for="">Ad Soyad</label>
            <input type="text" placeholder="Ad" />
            <input type="text" placeholder="Soyad" />
          </div>
          <br />
          <div>
            <input type="text" placeholder="Ata adı" />
          </div>
          <br />
          <div>
            <input type="number" placeholder="gün" />-
            <input type="text" placeholder="ay" />-
            <input type="number" placeholder="il" />
          </div>
          <br />
          <div>
            <input type="text" />
          </div>
          <br />
          <div>
            <input type="email" />
          </div>
          <br />
          <div>
            <input type="password" />
          </div>
          <br />
          <div>
            <input type="radio" name="gender" />Qadın
            <input type="radio" name="gender" />Kişi
          </div>
          <br />
          <div>
            <input type="checkbox" />Musiqi <input type="checkbox" />Film
            <input type="checkbox" />İdman <input type="checkbox" />Rəqs
          </div>
          <br />
          <div>
            <input type="file" />
          </div>
          <br />
          <div>
            <input type="text" placeholder=">Şəhər" />
          </div>
          <br />
          <div>
            <select name="" id="">
              <option value="">1</option>
              <option value="">2</option>
              <option value="">3</option>
              <option value="">4</option>
            </select>
          </div>

          <div>
            <textarea name="" id="" placeholder="Adres"></textarea>
          </div>

          <br>
          <div class="button_container">
            <span class="button">Göndər</span>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
